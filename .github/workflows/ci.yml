name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hora
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/hora
      SESSION_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
      SEED_ADMIN_EMAIL: admin@hora.tn
      SEED_ADMIN_PASSWORD: HoraAdmin123!
      SEED_CUSTOMER_EMAIL: client@hora.tn
      SEED_CUSTOMER_PASSWORD: HoraClient123!
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
